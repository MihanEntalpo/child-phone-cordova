<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Детский режим</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div class="container">
        <h1>Детский режим</h1>
        <p>Приложение заблокировано в режиме киоска. Для выхода нажмите кнопку ниже и подтвердите действие.</p>
        <div id="status" class="status">Инициализация…</div>
        <button id="exitButton" class="button" type="button">
            <span class="icon" aria-hidden="true"></span>
            <span>Выход</span>
        </button>
        <div class="footer">Для выхода требуется административное подтверждение.</div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
